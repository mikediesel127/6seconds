name = "6seconds"
main = "worker.js"
compatibility_date = "2024-01-01"

# KV namespace for storing moments and user data
[[kv_namespaces]]
binding = "MOMENTS"
id = "YOUR_KV_NAMESPACE_ID"

# Durable Objects for real-time rooms/connections
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[migrations]]
tag = "v1"
new_classes = ["RoomDurableObject"]

# R2 bucket for storing images/videos
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "6seconds-media"

[site]
bucket = "./"
include = ["index.html", "styles.css", "app.js", "camera.js"]
